[package]
name = "sailspan"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
object = { version = "0.39", default-features = false, features = ["read_core", "elf", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
object = { version = "0.39", default-features = false, features = ["elf", "write_std"] }
